<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel admin | IronForce</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://images.unsplash.com data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; script-src 'self'; form-action 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell container">
  <div class="dash-header">
    <div>
      <p class="eyebrow"><a href="index.html" class="logo">IRON<span>FORCE</span></a></p>
      <h1 class="dash-title">Panel de administracion</h1>
      <p class="hero-sub" style="margin:4px 0 0;">Hola, <span id="admin-name">...</span></p>
    </div>
    <button type="button" id="logout-btn" class="btn btn-outline btn-sm">Cerrar sesion</button>
  </div>

  <section class="dash-section">
    <h2>Nueva clase</h2>
    <p class="form-error" id="new-class-error" hidden></p>
    <form id="new-class-form" class="inline-form">
      <div class="form-row">
        <label for="title">Titulo</label>
        <input type="text" id="title" name="title" maxlength="80" required>
      </div>
      <div class="form-row">
        <label for="trainer_name">Entrenador</label>
        <input type="text" id="trainer_name" name="trainer_name" maxlength="80">
      </div>
      <div class="form-row">
        <label for="location">Sala/ubicacion</label>
        <input type="text" id="location" name="location" maxlength="80">
      </div>
      <div class="form-row">
        <label for="starts_at">Inicio</label>
        <input type="datetime-local" id="starts_at" name="starts_at" required>
      </div>
      <div class="form-row">
        <label for="ends_at">Fin</label>
        <input type="datetime-local" id="ends_at" name="ends_at" required>
      </div>
      <div class="form-row">
        <label for="capacity">Cupo</label>
        <input type="number" id="capacity" name="capacity" min="1" max="200" required>
      </div>
      <div class="form-row" style="align-self:end;">
        <button type="submit" class="btn btn-primary">Crear clase</button>
      </div>
    </form>
  </section>

  <section class="dash-section">
    <h2>Clases</h2>
    <table class="data-table">
      <thead>
        <tr><th>Titulo</th><th>Inicio</th><th>Fin</th><th>Cupo</th><th>Estado</th><th></th></tr>
      </thead>
      <tbody id="classes-tbody">
        <tr><td colspan="6" class="empty-state">Cargando...</td></tr>
      </tbody>
    </table>
  </section>

  <section class="dash-section">
    <h2>Reservas recientes</h2>
    <table class="data-table">
      <thead>
        <tr><th>Cliente</th><th>Clase</th><th>Horario</th><th>Estado</th></tr>
      </thead>
      <tbody id="bookings-tbody">
        <tr><td colspan="4" class="empty-state">Cargando...</td></tr>
      </tbody>
    </table>
  </section>
</div>
<script type="module" src="js/admin-dashboard.js"></script>
</body>
</html>
