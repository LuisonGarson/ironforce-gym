<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesion | IronForce</title>
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://images.unsplash.com data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; script-src 'self'; form-action 'self'; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <p class="eyebrow"><a href="index.html" class="logo">IRON<span>FORCE</span></a></p>
    <h1>Iniciar sesion</h1>
    <p class="auth-sub">Entra a tu cuenta para reservar clases o administrar el gimnasio.</p>

    <p class="form-error" id="login-error" role="alert" hidden></p>

    <form class="auth-form" id="login-form" novalidate>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="form-row">
        <label for="password">Contrasena</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>

    <p class="auth-switch">No tenes cuenta? <a href="registro.html">Registrate</a></p>
  </div>
</div>
<script type="module" src="js/auth.js"></script>
</body>
</html>
